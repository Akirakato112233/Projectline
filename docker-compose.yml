services:
  db:
    image: postgres:16-alpine
    container_name: projectline-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-projectline}
      POSTGRES_USER: ${DB_USER:-projectline}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-projectline}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-projectline} -d ${DB_NAME:-projectline}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend1:
    build:
      context: .
      dockerfile: myproject/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-projectline}
      DB_USER: ${DB_USER:-projectline}
      DB_PASSWORD: ${DB_PASSWORD:-projectline}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-123}
      DASHBOARD_DISPLAY_NAME: ${DASHBOARD_DISPLAY_NAME:-Admin}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - django_static:/app/myproject/staticfiles

  backend2:
    build:
      context: .
      dockerfile: myproject/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-projectline}
      DB_USER: ${DB_USER:-projectline}
      DB_PASSWORD: ${DB_PASSWORD:-projectline}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-123}
      DASHBOARD_DISPLAY_NAME: ${DASHBOARD_DISPLAY_NAME:-Admin}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - django_static:/app/myproject/staticfiles

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: projectline-nginx
    restart: unless-stopped
    depends_on:
      - backend1
      - backend2
    ports:
      - "80:80"
    volumes:
      - django_static:/var/www/django-static:ro

volumes:
  postgres_data:
  django_static:
